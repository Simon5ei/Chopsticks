d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#b45309" stroke-width="1.5"/></marker><marker id="c2410c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#c2410c" stroke-width="1.5"/></marker><marker id="dbeafe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#dbeafe" stroke-width="1.5"/></marker><marker id="ddd6fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#ddd6fe" stroke-width="1.5"/></marker><marker id="fed7aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fed7aa" stroke-width="1.5"/></marker><marker id="fef3c7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#fef3c7" stroke-width="1.5"/></marker><marker id="ffffff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#ffffff" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text fill="#1e40af" font-size="45" text-anchor="start"><tspan x="60" y="75.0">筷子 · 四平台浏览与私有回顾</tspan></text><text fill="#64748b" font-size="23" text-anchor="start"><tspan x="60" y="126.0">2026-11-09 接入改动 · 本地候选分支 · 四平台已用合成素材验收</tspan></text><rect x="62" y="158" width="24" height="20" rx="16" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text fill="#374151" font-size="19" text-anchor="start"><tspan x="97" y="172.0">既有链路</tspan></text><rect x="300" y="158" width="24" height="20" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#374151" font-size="19" text-anchor="start"><tspan x="335" y="172.0">本轮新增或增强</tspan></text><rect x="635" y="158" width="24" height="20" rx="16" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text fill="#374151" font-size="19" text-anchor="start"><tspan x="670" y="172.0">现有模型</tspan></text><rect x="870" y="158" width="24" height="20" rx="16" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text fill="#374151" font-size="19" text-anchor="start"><tspan x="905" y="172.0">私有结果</tspan></text><text fill="#1e40af" font-size="27" text-anchor="start"><tspan x="60" y="250.0">01   复用调度与平台会话</tspan></text><rect x="60" y="274" width="365" height="118" rx="16" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text fill="#1e3a5f" font-size="25" text-anchor="start"><tspan x="82" y="316.0">定时浏览事件</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="82" y="350.0">timer · 单一目标 itemId</tspan><tspan x="82" y="376.0">沿用当前平台浏览机会</tspan></text><rect x="475" y="274" width="420" height="118" rx="16" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text fill="#1e3a5f" font-size="25" text-anchor="start"><tspan x="497" y="316.0">全局 / 内容 Router</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="497" y="350.0">沿原规则决定是否浏览</tspan><tspan x="497" y="376.0">交给该平台已有的持久会话</tspan></text><rect x="945" y="274" width="665" height="118" rx="16" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/><text fill="#1e3a5f" font-size="25" text-anchor="start"><tspan x="967" y="316.0">原有平台会话与读工具</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="967" y="350.0">票据仍绑定来源、范围和内容目标</tspan><tspan x="967" y="376.0">手动与社交流程继续走既有入口</tspan></text><polyline points="425,333 475,333" fill="none" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#1e3a5f)"/><polyline points="895,333 945,333" fill="none" stroke="#1e3a5f" stroke-width="2.5" marker-end="url(#1e3a5f)"/><polyline points="1285,392 1285,446" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><rect x="680" y="446" width="930" height="112" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#c2410c" font-size="25" text-anchor="start"><tspan x="702" y="488.0">受管浏览轮 · 只读边界</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="702" y="522.0">按平台开关生效；绑定本轮条目；只开放读工具和反思工具</tspan><tspan x="702" y="548.0">每轮最多 4 种读取尝试，不开放评论、点赞、发帖或私信</tspan></text><text fill="#64748b" font-size="23" text-anchor="start"><tspan x="60" y="482.0">新增约束挂在原平台会话上。</tspan><tspan x="60" y="511.9">仅在带明确目标的定时浏览轮生效。</tspan></text><text fill="#1e40af" font-size="27" text-anchor="start"><tspan x="60" y="633.0">02   从原平台工具收集有来源的证据</tspan></text><polyline points="1140,558 1140,658 234,658 234,689" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><rect x="60" y="689" width="350" height="119" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#c2410c" font-size="25" text-anchor="start"><tspan x="82" y="731.0">B站</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="82" y="765.0">字幕片段及时间戳</tspan><tspan x="82" y="791.0">受限关键帧采样</tspan></text><polyline points="234,808 234,847 628,847 628,893" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><polyline points="1140,558 1140,658 639,658 639,689" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><rect x="465" y="689" width="350" height="119" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#c2410c" font-size="25" text-anchor="start"><tspan x="487" y="731.0">小黑盒</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="487" y="765.0">正文 / 摘录分开</tspan><tspan x="487" y="791.0">最多采样 4 条回帖</tspan></text><polyline points="639,808 639,847 628,847 628,893" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><polyline points="1140,558 1140,658 1044,658 1044,689" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><rect x="870" y="689" width="350" height="119" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#c2410c" font-size="25" text-anchor="start"><tspan x="892" y="731.0">QQ 空间</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="892" y="765.0">好友范围正文 / 摘录</tspan><tspan x="892" y="791.0">单独标明可见范围</tspan></text><polyline points="1044,808 1044,847 628,847 628,893" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><polyline points="1140,558 1140,658 1449,658 1449,689" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><rect x="1275" y="689" width="350" height="119" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#c2410c" font-size="25" text-anchor="start"><tspan x="1297" y="731.0">抖音</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="1297" y="765.0">描述 / 图文 / 可取画面</tspan><tspan x="1297" y="791.0">素材缺失单独标记</tspan></text><polyline points="1449,808 1449,847 628,847 628,893" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><polyline points="1330,847 1330,893" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><text fill="#c2410c" font-size="17" text-anchor="start"><tspan x="1350" y="867.0">本轮文字 / 图片</tspan></text><text fill="#1e40af" font-size="27" text-anchor="start"><tspan x="60" y="914.0">03   保存与回顾</tspan></text><rect x="360" y="893" width="600" height="153" rx="16" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><text fill="#c2410c" font-size="25" text-anchor="start"><tspan x="382" y="935.0">统一浏览记录 · SQLite</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="382" y="969.0">content_observations</tspan><tspan x="382" y="995.0">记录实际读到什么、来源和缺失项</tspan><tspan x="382" y="1021.0">在独立字段保存总结、感想与跳过理由</tspan></text><rect x="1030" y="893" width="580" height="153" rx="16" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/><text fill="#6d28d9" font-size="25" text-anchor="start"><tspan x="1052" y="935.0">原有 DeepSeek / 平台会话</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="1052" y="969.0">可读取绑定的文字和图片</tspan><tspan x="1052" y="995.0">经 chopsticks_content_reflect</tspan><tspan x="1052" y="1021.0">把总结与个人感想写入本轮</tspan></text><polyline points="1030,978 960,978" fill="none" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#6d28d9)"/><polyline points="660,1046 660,1104" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#c2410c)"/><rect x="60" y="1104" width="900" height="175" rx="16" fill="#a7f3d0" stroke="#047857" stroke-width="2"/><text fill="#047857" font-size="25" text-anchor="start"><tspan x="82" y="1146.0">私有日终回顾 · 管理端按范围读取</tspan></text><text fill="#374151" font-size="20" text-anchor="start"><tspan x="82" y="1180.0">北京时间 23:30 归档，支持简版、详细或关闭</tspan><tspan x="82" y="1206.0">GET /api/chopsticks/content-recap</tspan><tspan x="82" y="1232.0">公开素材回顾与好友范围回顾分开，均限所有者读取</tspan></text><text fill="#c2410c" font-size="19" text-anchor="start"><tspan x="879" y="1143.0">新增</tspan></text><rect x="1030" y="1104" width="580" height="175" rx="16" fill="#1e293b" stroke="#1e293b" stroke-width="2"/><text fill="#ffffff" font-size="21" text-anchor="start"><tspan x="1055" y="1148.0">抖音有画面、缺字幕时的记录示例</tspan></text><text fill="#22c55e" font-size="19" text-anchor="start"><tspan x="1055" y="1187.0">evidence = ["description", "frames"]</tspan><tspan x="1055" y="1211.7">missing  = ["subtitles"]</tspan><tspan x="1055" y="1236.4">summary  / reaction 分开保存</tspan></text><text fill="#64748b" font-size="21" text-anchor="start"><tspan x="60" y="1353.0">部署状态：各平台开关默认关闭 · 私有回顾不会发布到平台 · 不回填既往经历</tspan></text></g></svg>