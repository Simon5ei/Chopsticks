<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人际关系 · 筷子</title><link rel="stylesheet" href="/api/chopsticks/relationships.css"><script type="module" src="/api/chopsticks/relationships.js"></script></head>
<body><header><a class="brand" href="/">筷子 <span>CHOPSTICKS</span></a><span class="section">管理后台 / 人际关系</span><a href="/api/chopsticks/mood">心境</a><a href="/api/chopsticks/pipeline">执行链路</a><a href="/">返回 DSH ↗</a></header>
<main><div class="heading"><div><p class="eyebrow">大肥鱼的社交世界</p><h1>那些一起聊过天的人</h1><p class="intro">QQ 群聊与私聊 · 内容平台仅私聊</p></div><div class="stats"><strong id="node-count">—</strong> 位人物 <span> / </span><strong id="edge-count">—</strong> 条关系</div></div>
<section class="toolbar" aria-label="关系图工具栏"><label class="search">搜索人物<input id="search" type="search" placeholder="名字或账号" autocomplete="off"></label><label>平台<select id="platform"><option value="all">全部平台</option><option value="qq">QQ</option><option value="bili">B站私聊</option><option value="douyin">抖音私聊</option><option value="heybox">小黑盒私聊</option></select></label><label class="check"><input id="hypotheses" type="checkbox" checked>显示推测</label><div class="buttons"><button id="fit">适应画布</button><button id="layout">重新排列</button><button id="refresh">刷新</button></div></section>
<p id="status" role="status" aria-live="polite">正在读取关系图…</p>
<div class="workspace"><section class="graph-shell" aria-label="关系网图"><canvas id="graph" tabindex="0" aria-label="无向关系图：拖动空白平移，滚轮缩放，拖动人物调整位置；也可通过右侧人物列表选择"></canvas><div id="empty" hidden><h2>关系还在慢慢形成</h2><p>人际关系总结保存后，这里会自动出现有依据的人物和连线。</p></div><div class="legend"><span class="solid"></span>已观察 <span class="dashed"></span>推测 <span>拖动平移 · 滚轮缩放 · 右下角调整画布大小</span></div><div class="zoom"><button id="zoom-in" aria-label="放大">+</button><button id="zoom-out" aria-label="缩小">−</button></div></section>
<aside><div id="detail"><p class="eyebrow">人物档案</p><h2>选择一位人物</h2><p>点击节点或下方名字，查看关系、更新时间和来源记录。</p></div><div class="people-title">人物列表 <span id="list-count"></span></div><div id="people" aria-label="人物列表"></div></aside></div>
<footer><span id="updated">尚未生成总结</span><span>无向图 · 每次人际总结后更新 · 每 30 秒同步</span></footer></main></body></html>
