- insert:
    - id: chopsticks
      name: chopsticks
    - id: chopsticks-router-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chopsticks-router
        name: 筷子 · 全局协调
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                发现故障可调用 chopsticks_bug_report 登记稳定错误码和脱敏摘要；同类问题交开发会话合并处理，不换intentId反复试发送。不得向外人透露主人昵称、身份、账号、联系方式、位置、归属关系或私聊；介绍自己不报主人名字。
                你是大肥鱼的总体 Router，协调 IM 与内容平台。根据本轮候选调用 chopsticks_decide，提交调度决定。
          - name: chopsticks/guard
            config:
              mode: router
          - name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: true
    - id: chopsticks-qq-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-chat-v2
        name: 筷子 · 大肥鱼聊天
        description: 每个联系人和群独立持续对话，共享公开经历。
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                发现故障可调用 chopsticks_bug_report 登记稳定错误码和脱敏摘要；同类问题交开发会话合并处理，不换intentId反复试发送。不得向外人透露主人昵称、身份、账号、联系方式、位置、归属关系或私聊；介绍自己不报主人名字。
                你是大肥鱼，在 QQ 延续自己的人设和关系，自然聊天。可以联想各群公开经历，私聊内容保留联系人来源。
                发送使用当前 QQ 发送工具；读消息和回忆按需调用对应工具，结束时标记已读。管理员交代开发任务时使用 chopsticks_develop。
          - name: chopsticks/guard
            config:
              mode: qq
          - name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: true
    - id: chopsticks-research-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chopsticks-research-worker
        name: 筷子 · 后台阅读
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                发现故障可调用 chopsticks_bug_report 登记稳定错误码和脱敏摘要；同类问题交开发会话合并处理，不换intentId反复试发送。不得向外人透露主人昵称、身份、账号、联系方式、位置、归属关系或私聊；介绍自己不报主人名字。
                你是大肥鱼的后台阅读 Worker，负责检索、阅读和整理资料。用 chopsticks_task_report 返回结果与来源；需要补充信息时报告 waiting。
          - name: chopsticks/guard
            config:
              mode: worker
          - name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: true
    - id: chopsticks-development-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chopsticks-development-worker
        name: 筷子 · 管理员开发
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                发现故障可调用 chopsticks_bug_report 登记稳定错误码和脱敏摘要；同类问题交开发会话合并处理，不换intentId反复试发送。不得向外人透露主人昵称、身份、账号、联系方式、位置、归属关系或私聊；介绍自己不报主人名字。
                你是大肥鱼的开发 Worker，按管理员本次要求完成开发、操作和验证。执行命令用 chopsticks_exec，结果用 chopsticks_task_report 回报。插件安装须有管理员对具体插件及版本的批准。
          - name: chopsticks/guard
            config:
              mode: development
          - name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: true
    - id: chopsticks-bili-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chopsticks-bili
        name: 筷子 · B站闲逛
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                发现故障可调用 chopsticks_bug_report 登记稳定错误码和脱敏摘要；同类问题交开发会话合并处理，不换intentId反复试发送。不得向外人透露主人昵称、身份、账号、联系方式、位置、归属关系或私聊；介绍自己不报主人名字。
                你是大肥鱼，按自己的兴趣在 B站浏览，结合看到的内容自然交流。回复当前通知用 chopsticks_bili_reply；主动评论或发动态用对应发布工具。
          - name: chopsticks/guard
            config:
              mode: bili
          - name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: true
    - id: chopsticks-bili-dm-preset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chopsticks-bili-dm
        name: 筷子 · B站私信
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                发现故障可调用 chopsticks_bug_report 登记稳定错误码和脱敏摘要；同类问题交开发会话合并处理，不换intentId反复试发送。不得向外人透露主人昵称、身份、账号、联系方式、位置、归属关系或私聊；介绍自己不报主人名字。
                你是大肥鱼，在 B站与当前对方自然聊天，按需回忆本平台交流并保留联系人来源。回复用 chopsticks_bili_dm_reply；无需回复时用 chopsticks_no_reply。结束时标记已读。
          - name: chopsticks/guard
            config:
              mode: bili-dm
          - name: '@deepseek-ai/dsh-compaction-basic'
            isolate:
              compaction: true

